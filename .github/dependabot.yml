# Propose dependency updates only; never merge or deploy automatically.
# pnpm is detected through package.json and pnpm-lock.yaml.
version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      production-minor-patch:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      development-minor-patch:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    ignore:
      # SheetJS is intentionally pinned to the official CDN tarball.
      # Review its releases and integrity manually; never replace it with
      # the outdated npm registry package.
      - dependency-name: "xlsx"

  - package-ecosystem: "npm"
    directory: "/e2e"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 2
    groups:
      e2e-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
