name: Security and regression CI
on:
  push:
    branches:
      - main
      - test/security-regression-hardening-20261121
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Web regression tests
        run: pnpm test:web
      - name: D1 integration tests
        run: pnpm test:integration
      - name: Typecheck and build
        run: pnpm build
      - name: Fail CI on high-severity production advisories
        run: pnpm audit --prod --audit-level high
      - name: Full production advisory report (informational)
        if: always()
        continue-on-error: true
        run: pnpm audit --prod --audit-level low
