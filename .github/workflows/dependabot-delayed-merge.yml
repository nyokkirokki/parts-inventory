name: Delayed Dependabot auto-merge (minor/patch only)

on:
  schedule:
    # Daily 12:17 JST; scheduling is best-effort.
    - cron: '17 3 * * *'
  workflow_dispatch:

# Trusted default branch only. Never checkout or execute Dependabot PR code.
permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: dependabot-delayed-merge
  cancel-in-progress: false

jobs:
  guarded-merge:
    name: Evaluate mature Dependabot updates
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted main only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Run independent guard tests
        run: node --test scripts/dependabot-delayed-merge.test.mjs
      - name: Evaluate and merge eligible Dependabot PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/dependabot-delayed-merge.mjs
